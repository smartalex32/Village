project_id = "village-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "village://onboarding"
additional_redirect_urls = ["village://onboarding", "village://update-password", "village://accept-invite/**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "5MiB"

[functions.send-invitation]
verify_jwt = true

[functions.deliver-notifications]
verify_jwt = false

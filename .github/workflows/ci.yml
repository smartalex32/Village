name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the native app
        run: xcodebuild test -project Village.xcodeproj -scheme Village -destination 'platform=iOS Simulator,name=iPhone 16 Pro' CODE_SIGNING_ALLOWED=NO
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: supabase start
      - run: supabase db lint --local --level error
      - run: supabase test db
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint --config supabase/functions/deno.json supabase/functions
      - run: deno check --config supabase/functions/deno.json supabase/functions/send-invitation/index.ts supabase/functions/deliver-notifications/index.ts
      - run: deno test --config supabase/functions/deno.json supabase/functions
